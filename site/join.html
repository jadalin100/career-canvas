<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Join the Career Canvas class with a class code and username."><title>Join Class — Career Canvas</title><link rel="icon" href="assets/career-canvas-logo.png"><link rel="stylesheet" href="classroom.css?v=1"></head><body><div class="class-shell"><header class="class-header"><a class="class-brand" href="index.html"><img src="assets/career-canvas-logo.png" alt="">Career Canvas</a><nav class="class-nav"><a href="index.html">Home</a><a href="teacher.html">Teacher</a></nav></header><main class="class-main"><section class="class-hero"><div><p class="kicker">Student class</p><h1>Join your Career Canvas class.</h1></div><p>Use the class code from Jada, then choose a username you will remember.</p></section><p class="mode-banner" data-mode-banner></p><form class="join-card" id="class-join-form"><h2>Enter the class</h2><p class="help">For privacy, use a nickname or first name plus a number—not your full name.</p><div class="field"><label for="class-code">Class code</label><input id="class-code" name="code" inputmode="text" autocapitalize="characters" autocomplete="off" maxlength="12" required placeholder="Enter class code"></div><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="nickname" maxlength="20" minlength="3" pattern="[A-Za-z0-9 _-]+" required placeholder="Example: CreativeFox7"></div><button class="class-button" type="submit" style="margin-top:22px">Join class →</button><p class="status" id="join-status" role="status" aria-live="polite"></p></form></main></div><script src="classroom-config.js?v=1"></script><script src="classroom-data.js?v=1"></script><script src="classroom-ui.js?v=1"></script></body></html>
