<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — Career &amp; College Compass</title>
<!-- bump ?v= after editing style.css or app.js so browsers don't serve a stale copy -->
<link rel="stylesheet" href="style.css?v=12">
</head>
<body data-page="quiz">

<div class="topbar" id="topbar">
  <div class="topbar-in">
    <a href="index.html" class="brand" aria-label="Back to all quizzes">
      <span data-compass></span>
      <span class="brand-name rail-hide">Compass</span>
    </a>
    <span class="progress-line"><span class="bar" id="bar"><i></i></span></span>
    <span class="count" id="count">1 / 30</span>

</div>

  <aside class="rail" aria-label="Your progress">

      <li class="now">Your interests</li>
      <li>What you'd geek out over</li>
