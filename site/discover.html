<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Three Career Canvas discovery quizzes: a business career, the digital marketing role you would enjoy most, and a DECA event that fits you.">
  <title>Quizzes — Career Canvas</title>
  <link rel="icon" href="assets/career-canvas-logo.png?v=2" type="image/png">
  <link rel="stylesheet" href="canvas.css?v=21">
<link rel="stylesheet" href="shell.css?v=7"><script src="shell.js?v=7" defer></script></head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <main id="main">
    <section class="quiz-hub section" id="quizzes">
      <div class="quiz-overview" id="quiz-overview">
        <div class="section-heading reveal">
          <p class="kicker">Find your direction</p>
          <h2>Three quizzes</h2>
          <p>Explore a possible business career, find a DECA event that fits how you work, or discover the part of digital marketing you would most enjoy creating.</p>
        </div>
        <div class="canvas-quiz-grid" id="canvas-quiz-cards" aria-label="Career Canvas quizzes"></div>
      </div>

      <div class="canvas-quiz-stage" id="canvas-quiz-stage" hidden>
        <div class="quiz-stage-top">
          <a class="quiz-back" href="#quizzes">Back to all quizzes</a>
          <p class="quiz-stage-label" id="quiz-stage-label"></p>
          <p class="quiz-stage-count" id="quiz-stage-count"></p>
        </div>
        <div class="quiz-stage-progress" aria-hidden="true"><i id="quiz-stage-progress"></i></div>
        <div class="quiz-stage-body" id="quiz-stage-body" tabindex="-1"></div>
      </div>
    </section>
  </main>

  <script src="quiz-data.js?v=2"></script>
  <script src="classroom-config.js?v=4"></script>
  <script src="classroom-data.js?v=8"></script>
  <script src="canvas.js?v=7"></script>
  <script src="canvas-quizzes.js?v=5"></script>
</body>
</html>
